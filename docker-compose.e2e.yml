services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    environment:
      - E2E_BASE_URL=http://host.docker.internal:3000
      - E2E_TEST_USER_EMAIL=${E2E_TEST_USER_EMAIL}
      - E2E_TEST_USER_PASSWORD=${E2E_TEST_USER_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
