services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    env_file:
      - .env.test
    environment:
      - E2E_BASE_URL=http://host.docker.internal:3000
      - CI=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
    command: pnpm e2e
