<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - STUDIO</title>

    <!-- Tải Tailwind CSS để cấu trúc giao diện nhanh -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tải Font chữ Inter và Merriweather từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tải FontAwesome cho các icon (mũ tốt nghiệp, user, lock, v.v.) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Thiết lập cấu hình cơ bản cho Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    },
                    colors: {
                        primary: '#7B61FF',
                        'primary-dark': '#6A45E5',
                        'primary-light': '#8A63F7',
                        background: '#f4f5f7',
                        'text-main': '#1a1a1a',
                        'text-muted': '#555555',
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen flex justify-center items-center p-4 font-sans text-gray-800 relative overflow-hidden bg-slate-50">

    <!-- Background trang trí (Mesh Gradient mờ ảo) -->
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
        <!-- Khối màu tím -->
        <div class="absolute -top-[20%] -left-[10%] w-[60vw] h-[60vw] max-w-[600px] max-h-[600px] rounded-full bg-primary-light/25 blur-[80px] md:blur-[120px] mix-blend-multiply"></div>
        <!-- Khối màu xanh dương -->
        <div class="absolute bottom-[-10%] -right-[10%] w-[50vw] h-[50vw] max-w-[500px] max-h-[500px] rounded-full bg-blue-300/20 blur-[80px] md:blur-[120px] mix-blend-multiply"></div>
        <!-- Khối màu tím nhạt ở giữa -->
        <div class="absolute top-[20%] right-[15%] w-[30vw] h-[30vw] max-w-[300px] max-h-[300px] rounded-full bg-purple-300/30 blur-[60px] md:blur-[100px] mix-blend-multiply"></div>
    </div>

    <!-- Thẻ chứa form đăng nhập (Login Card) - Thêm hiệu ứng Kính mờ (Glassmorphism) -->
    <div class="relative z-10 bg-white/85 backdrop-blur-xl w-full max-w-[420px] p-8 md:p-10 rounded-[24px] shadow-[0_20px_40px_rgba(0,0,0,0.08)] border border-white/60">

        <!-- Khu vực Logo & Tiêu đề đã được tối ưu lại -->
        <div class="flex flex-col items-center mb-8">
            <!-- Icon -->
            <div class="bg-gradient-to-br from-primary-light to-primary-dark w-14 h-14 rounded-2xl flex justify-center items-center text-white text-2xl mb-4 shadow-lg shadow-primary/30">
                <i class="fas fa-graduation-cap"></i>
            </div>

            <!-- Tiêu đề chính -->
            <h2 class="font-sans text-2xl font-bold text-gray-800 tracking-tight">
                Đăng nhập
            </h2>
        </div>

        <form action="#" method="POST" onsubmit="event.preventDefault(); showSuccessMessage();">
            <!-- Ô nhập Tài khoản/Email -->
            <div class="relative mb-4">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                    <i class="far fa-user text-sm"></i>
                </div>
                <input type="text"
                       placeholder="Email hoặc Tên đăng nhập"
                       required
                       class="w-full pl-11 pr-4 py-3.5 bg-white border border-gray-200 rounded-full text-sm text-gray-700 outline-none transition-all duration-300 focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-gray-400">
            </div>

            <!-- Ô nhập Mật khẩu -->
            <div class="relative mb-2">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                    <i class="fas fa-lock text-sm"></i>
                </div>
                <input type="password"
                       id="password"
                       placeholder="Mật khẩu"
                       required
                       class="w-full pl-11 pr-11 py-3.5 bg-white border border-gray-200 rounded-full text-sm text-gray-700 outline-none transition-all duration-300 focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-gray-400">
                <!-- Nút ẩn/hiện mật khẩu -->
                <button type="button"
                        onclick="togglePassword()"
                        class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-primary transition-colors cursor-pointer outline-none">
                    <i class="far fa-eye-slash text-sm" id="toggleIcon"></i>
                </button>
            </div>

            <!-- Quên mật khẩu -->
            <div class="text-right mb-6">
                <a href="#" class="text-[13px] text-text-muted hover:text-primary font-medium transition-colors inline-block">
                    Quên mật khẩu?
                </a>
            </div>

            <!-- Nút Submit -->
            <button type="submit"
                    class="w-full bg-primary hover:bg-primary-dark text-white font-semibold text-sm py-3.5 rounded-full transition-all duration-300 shadow-md hover:shadow-lg shadow-primary/25 mb-6">
                ĐĂNG NHẬP
            </button>
        </form>

        <!-- Liên kết Đăng ký -->
        <div class="text-center text-sm text-text-muted">
            Chưa có tài khoản?
            <a href="#" class="text-text-main font-semibold hover:underline hover:text-primary transition-colors">Đăng ký ngay.</a>
        </div>

        <!-- Box thông báo (ẩn mặc định) -->
        <div id="messageBox" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded-lg text-sm text-center font-medium">
            <i class="fas fa-check-circle mr-1"></i> Đăng nhập thành công (Mô phỏng)!
        </div>

    </div>

    <script>
        // Hàm ẩn hiện mật khẩu
        function togglePassword() {
            const pwdInput = document.getElementById("password");
            const icon = document.getElementById("toggleIcon");

            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
                icon.classList.add("text-primary");
            } else {
                pwdInput.type = "password";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
                icon.classList.remove("text-primary");
            }
        }

        // Hàm mô phỏng hiển thị thông báo khi bấm đăng nhập thay vì dùng alert()
        function showSuccessMessage() {
            const msgBox = document.getElementById("messageBox");
            msgBox.classList.remove("hidden");
            msgBox.classList.add("animate-pulse");

            setTimeout(() => {
                msgBox.classList.remove("animate-pulse");
                msgBox.classList.add("hidden");
            }, 3000);
        }
    </script>
</body>
</html>s
