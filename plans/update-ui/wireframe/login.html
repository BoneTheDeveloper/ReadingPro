<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - STUDIO</title>

    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tải Font chữ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tải FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Cấu hình Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#7B61FF',
                        'primary-hover': '#6A45E5',
                        'linear-gray': '#F2F2F2',
                        'linear-gray-hover': '#E5E5E5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white flex flex-col items-center justify-center min-h-screen text-gray-900 font-sans antialiased selection:bg-primary/20 selection:text-primary">

    <div class="w-full max-w-[320px] flex flex-col items-center">

        <!-- Logo (Được làm nhỏ gọn và bo tròn hoàn toàn giống Linear) -->
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#8A63F7] to-[#6A45E5] flex items-center justify-center text-white mb-6 shadow-sm">
            <i class="fas fa-graduation-cap text-[16px]"></i>
        </div>

        <!-- Tiêu đề -->
        <h1 class="text-[17px] font-semibold mb-8 text-gray-900 tracking-tight">Đăng nhập vào STUDIO</h1>

        <!-- Nút chính (Google) mang màu thương hiệu -->
        <button class="w-full bg-primary hover:bg-primary-hover text-white font-medium text-[14px] py-2.5 px-4 rounded-full flex items-center justify-center gap-2.5 transition-colors mb-2">
            <i class="fab fa-google text-[14px]"></i>
            Tiếp tục với Google
        </button>

        <!-- Chú thích siêu nhỏ bên dưới nút chính -->
        <p class="text-[12px] text-gray-500 mb-5">Bạn đã dùng Google để đăng nhập lần trước</p>

        <!-- Các nút phụ (Apple, Email) màu xám nhạt -->
        <div class="flex flex-col gap-2.5 w-full">
            <button class="w-full bg-linear-gray hover:bg-linear-gray-hover text-gray-800 font-medium text-[14px] py-2.5 px-4 rounded-full transition-colors flex items-center justify-center gap-2.5">
                <i class="fab fa-apple text-[16px] mb-0.5"></i>
                Tiếp tục với Apple
            </button>
            <button class="w-full bg-linear-gray hover:bg-linear-gray-hover text-gray-800 font-medium text-[14px] py-2.5 px-4 rounded-full transition-colors flex items-center justify-center">
                Tiếp tục với email
            </button>
        </div>

        <!-- Footer -->
        <div class="mt-10 text-[13px] text-gray-500">
            Chưa có tài khoản?
            <a href="#" class="text-gray-900 font-medium hover:underline">Đăng ký</a>
            hoặc
            <a href="#" class="text-gray-900 font-medium hover:underline">tìm hiểu thêm</a>
        </div>

    </div>

</body>
</html>
