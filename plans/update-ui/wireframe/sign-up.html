<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - STUDIO</title>

    <!-- Plus Jakarta Sans + Lora fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Design System Tokens */
        :root {
            /* Neutrals (warm paper base) */
            --paper: #F5F2EC;
            --panel: #FBF9F5;
            --surface: #FFFFFF;
            --border: #EAE5DB;
            --border-strong: #DAD4C8;
            --rail: #221F2B;

            /* Text */
            --ink: #221F2B;
            --ink-2: #565160;
            --ink-3: #908B98;

            /* Indigo (brand, primary action) */
            --indigo: #5A4FE0;
            --indigo-hover: #4A3FD0;
            --indigo-soft: #ECEAFB;
            --indigo-soft-border: #D6D1F7;

            /* Shadows */
            --shadow-card: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
            --shadow-indigo: 0 2px 5px rgba(90,79,224,.30), 0 6px 16px rgba(90,79,224,.20);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
        }

        /* Card Container */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-card);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-hover) 100%);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-indigo);
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            color: white;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--ink-2);
        }

        /* Form */
        .form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }

        .label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--ink);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--ink-3);
            pointer-events: none;
        }

        .input {
            width: 100%;
            padding: 9px 12px;
            padding-left: 40px;
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            transition: all 140ms ease;
        }

        .input::placeholder {
            color: var(--ink-3);
        }

        .input:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px rgba(90, 79, 224, 0.10);
        }

        .input.error {
            border-color: #E53E3E;
            box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.10);
        }

        /* Password toggle */
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--ink-3);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 140ms ease;
        }

        .password-toggle:hover {
            color: var(--ink-2);
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
        }

        /* Primary Button */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 11px 20px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: var(--indigo);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 140ms ease;
            box-shadow: var(--shadow-indigo);
        }

        .btn-primary:hover {
            background: var(--indigo-hover);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 0.75rem;
            color: var(--ink-3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* OAuth Button */
        .btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 11px 20px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 140ms ease;
        }

        .btn-oauth:hover {
            border-color: var(--indigo);
            color: var(--indigo);
        }

        .btn-oauth svg {
            width: 18px;
            height: 18px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--ink-2);
        }

        .footer a {
            color: var(--indigo);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Error message */
        .error-message {
            font-size: 0.75rem;
            color: #E53E3E;
            margin-top: 0.25rem;
        }

        /* Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="logo-icon">
                <!-- Graduation Cap Icon (Lucide) -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1 class="title">Tạo tài khoản</h1>
            <p class="subtitle">Tham gia để bắt đầu hành trình học tiếng Anh</p>
        </div>

        <!-- Form -->
        <form class="form" onsubmit="event.preventDefault(); handleSubmit();">
            <!-- Name Field -->
            <div class="form-group">
                <label class="label" for="name">Họ và tên</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input class="input" type="text" id="name" placeholder="Nguyễn Văn A" required autocomplete="name">
                </div>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label class="label" for="email">Email</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2"/>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                    <input class="input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label class="label" for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input class="input" type="password" id="password" placeholder="Ít nhất 8 ký tự" required minlength="8" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <!-- Eye Icon -->
                        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary" id="submit-btn">
                <span id="btn-text">Đăng ký</span>
                <div class="spinner" id="spinner" style="display: none;"></div>
            </button>

            <!-- Divider -->
            <div class="divider">
                <span>hoặc</span>
            </div>

            <!-- OAuth Button -->
            <button type="button" class="btn-oauth" onclick="handleOAuth()">
                <!-- Google Icon -->
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Tiếp tục với Google
            </button>
        </form>

        <!-- Footer -->
        <div class="footer">
            Đã có tài khoản? <a href="/sign-in">Đăng nhập</a>
        </div>
    </div>

    <script>
        // Password visibility toggle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" x2="22" y1="2" y2="22"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        }

        // Simulate form submission
        function handleSubmit() {
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            btn.disabled = true;
            btnText.textContent = 'Đang xử lý...';
            spinner.style.display = 'block';

            // Simulate API call
            setTimeout(() => {
                btn.disabled = false;
                btnText.textContent = 'Đăng ký';
                spinner.style.display = 'none';

                // Show success (in real app, redirect)
                alert('Đăng ký thành công! (Demo)');
            }, 2000);
        }

        // OAuth handler
        function handleOAuth() {
            alert('Đang chuyển hướng đến Google... (Demo)');
        }
    </script>
</body>
</html>
