name: Question
description: Ask a question about usage, behavior, or implementation
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to understand?
      placeholder: Ask your question here.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you tried or looked at already?

  - type: textarea
    id: related
    attributes:
      label: Related files or links
      description: Add relevant files, docs, issues, logs, or screenshots.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions first.
          required: true
