name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.3.0
          run_install: false

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Check E2E secrets
        id: e2e-secrets
        shell: bash
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          missing=()
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY DATABASE_URL DIRECT_URL E2E_TEST_USER_EMAIL E2E_TEST_USER_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "should_run_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Playwright E2E because required secrets are missing: ${missing[*]}"
          fi

      - name: Install Chromium
        if: steps.e2e-secrets.outputs.should_run_e2e == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        if: steps.e2e-secrets.outputs.should_run_e2e == 'true'
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: pnpm e2e

  validate-migration:
    name: Validate migration
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine migration diff base
        id: migration-diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_base="origin/${{ github.base_ref }}"
          else
            diff_base="${{ github.event.before }}"
            if [ -z "$diff_base" ] || [ "$diff_base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$diff_base^{commit}" 2>/dev/null; then
              if git cat-file -e "HEAD~1^{commit}" 2>/dev/null; then
                diff_base="HEAD~1"
              else
                diff_base=""
              fi
            fi
          fi
          echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"

      - name: Reject edits to existing migration SQL
        shell: bash
        run: |
          DIFF_BASE="${{ steps.migration-diff.outputs.diff_base }}"
          if [ -z "$DIFF_BASE" ]; then
            echo "::notice::No previous commit is available for migration rewrite validation."
            exit 0
          fi

          rewritten_migrations="$(git diff --name-status --diff-filter=MD "$DIFF_BASE...HEAD" -- "prisma/migrations/**/migration.sql" || true)"
          if [ -z "$rewritten_migrations" ]; then
            echo "No existing migration SQL edits or deletions detected."
            exit 0
          fi

          baseline_marker="$(git diff --name-only --diff-filter=AR "$DIFF_BASE...HEAD" -- "prisma/migrations/**/BASELINE_RESET.md" || true)"
          if [ -z "$baseline_marker" ]; then
            echo "::error::Existing migration SQL was modified or deleted. Create a new migration instead, or add a new prisma/migrations/**/BASELINE_RESET.md marker for an explicit baseline reset."
            printf '%s\n' "$rewritten_migrations"
            exit 1
          fi

          echo "::notice::Existing migration rewrite allowed by baseline reset marker:"
          printf '%s\n' "$baseline_marker"
          printf '%s\n' "$rewritten_migrations"

      - name: Check schema change has migration
        id: schema-check
        shell: bash
        run: |
          DIFF_BASE="${{ steps.migration-diff.outputs.diff_base }}"
          echo "diff_base=$DIFF_BASE" >> "$GITHUB_OUTPUT"
          if [ -z "$DIFF_BASE" ]; then
            echo "::notice::No previous commit is available for migration validation."
            exit 0
          fi

          if git diff --name-only "$DIFF_BASE...HEAD" | grep -qx "prisma/schema.prisma"; then
            echo "::group::Schema changes detected"
            git diff --name-only "$DIFF_BASE...HEAD" | grep "prisma/schema.prisma"
            echo "::endgroup::"

            migration_sql="$(git diff --name-status --diff-filter=AR "$DIFF_BASE...HEAD" -- "prisma/migrations/**/migration.sql" || true)"
            if [ -n "$migration_sql" ]; then
              echo "OK: added or renamed migration SQL file(s) included"
              printf '%s\n' "$migration_sql"
            else
              echo "::error::schema.prisma changed but no migration file included. Run 'pnpm exec prisma migrate dev --name <name>' locally."
              exit 1
            fi
          else
            echo "No schema changes — skipping migration check."
          fi

      - name: Show migration SQL diff
        if: always()
        shell: bash
        run: |
          DIFF_BASE="${{ steps.schema-check.outputs.diff_base }}"
          if [ -n "$DIFF_BASE" ] && git diff --name-only "$DIFF_BASE...HEAD" -- "prisma/migrations/**/migration.sql" | grep -q .; then
            echo "Migration files changed — review the SQL below:"
            git diff "$DIFF_BASE...HEAD" -- "prisma/migrations/**/*.sql"
          fi

      - name: Validate schema
        run: pnpm exec prisma validate
