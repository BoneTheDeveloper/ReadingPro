name: Migrate DB

on:
  push:
    branches:
      - staging
      - main
      - master

permissions:
  contents: read

jobs:
  # ─── Stage 3: Staging ─────────────────────────────────────────────
  staging:
    name: Migrate staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec prisma migrate status

      - name: Seed checks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:validate:dictionary

  # ─── Stage 4: Production ──────────────────────────────────────────
  production:
    name: Migrate production
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Neon CLI
        run: npm install -g neonctl

      - name: Create branch restore point
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Creating restore point on production branch..."
          neonctl branches create \
            --project-id "${{ secrets.NEON_PROJECT_ID }}" \
            --branch-name "restore-$(date +%Y%m%d-%H%M%S)" \
            --parent "production" \
            || echo "::warning::Restore point creation failed — continuing migration."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec prisma migrate status

      - name: Trigger Vercel production deploy
        if: success()
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      - name: Post-deploy health check
        run: |
          echo "Waiting for deployment to go live..."
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.PRODUCTION_URL }}/api/health" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Post-deploy health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Post-deploy health check passed (HTTP $STATUS)"
