name: Migrate DB

on:
  pull_request:
  push:
    branches:
      - staging
      - main
      - master

permissions:
  contents: read

jobs:
  # ─── Stage 2: PR validation ───────────────────────────────────────
  validate:
    name: Validate migration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check schema change has migration
        run: |
          BASE="${{ github.base_ref }}"
          if git diff --name-only "origin/$BASE...HEAD" | grep -q "prisma/schema.prisma"; then
            echo "::group::Schema changes detected"
            git diff --name-only "origin/$BASE...HEAD" | grep "prisma/schema.prisma"
            echo "::endgroup::"

            if git diff --name-only "origin/$BASE...HEAD" | grep -q "prisma/migrations/"; then
              echo "OK: migration file(s) included"
              git diff --name-only "origin/$BASE...HEAD" | grep "prisma/migrations/"
            else
              echo "::error::schema.prisma changed but no migration file included. Run 'pnpm exec prisma migrate dev --name <name>' locally."
              exit 1
            fi
          else
            echo "No schema changes — skipping migration check."
          fi

      - name: Audit migration SQL
        if: always()
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -q "prisma/migrations/"; then
            echo "Migration files changed — review the SQL below:"
            git diff "origin/$BASE...HEAD" -- "prisma/migrations/**/*.sql"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate schema
        run: pnpm exec prisma validate

  # ─── Stage 3: Staging / development ───────────────────────────────
  staging:
    name: Migrate staging
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec prisma migrate status

      - name: Seed checks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:validate:dictionary

  # ─── Stage 4: Production ──────────────────────────────────────────
  production:
    name: Migrate production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Neon CLI
        run: npm install -g neonctl

      - name: Create branch restore point
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          echo "Creating restore point on production branch..."
          neonctl branches create \
            --project-id "${{ secrets.NEON_PROJECT_ID }}" \
            --branch-name "restore-$(date +%Y%m%d-%H%M%S)" \
            --parent "production" \
            || echo "::warning::Restore point creation failed — continuing migration."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec prisma migrate status

      - name: Trigger Vercel production deploy
        if: success()
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      - name: Post-deploy health check
        run: |
          echo "Waiting for deployment to go live..."
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.PRODUCTION_URL }}/api/health" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Post-deploy health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Post-deploy health check passed (HTTP $STATUS)"
