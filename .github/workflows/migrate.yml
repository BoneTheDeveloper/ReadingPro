name: Migrate DB

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  # ─── Production ───────────────────────────────────────────────────
  production:
    name: Migrate production
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production-migration
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify workflow run is current branch head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_BRANCH" \
            > latest-commit.json

          LATEST_SHA=$(node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('latest-commit.json','utf8')); console.log(body.sha ?? '')")
          if [ "$LATEST_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Skipping stale production migration for $EXPECTED_SHA because $HEAD_BRANCH is now $LATEST_SHA."
            exit 1
          fi

          echo "Verified $HEAD_BRANCH still points to $EXPECTED_SHA."

      - name: Verify production database target
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
          NEON_PRODUCTION_BRANCH_NAME: production
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_PRODUCTION_BRANCH_ID" \
            > neon-branch.json

          BRANCH_NAME=$(node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('neon-branch.json','utf8')); console.log(body.branch?.name ?? '')")
          if [ "$BRANCH_NAME" != "$NEON_PRODUCTION_BRANCH_NAME" ]; then
            echo "::error::Expected Neon branch '$NEON_PRODUCTION_BRANCH_NAME' but got '$BRANCH_NAME'."
            exit 1
          fi
          echo "Verified Neon production branch '$BRANCH_NAME'."

      - name: Verify production migration URL target
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ vars.NEON_PRODUCTION_BRANCH_ID }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$NEON_PRODUCTION_BRANCH_ID/endpoints" \
            > neon-endpoints.json

          node scripts/database/verify-direct-url-endpoint.mjs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.3.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight production deploy config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required production deploy secret(s): ${missing[*]}"
            exit 1
          fi

          node scripts/database/verify-production-deploy-config.mjs

      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          APP_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set +e
          status_output="$(pnpm exec prisma migrate status 2>&1)"
          status_code=$?
          set -e

          printf '%s\n' "$status_output"

          if printf '%s\n' "$status_output" | grep -Eiq "not yet been applied|database schema is not up to date|pending migrations?:"; then
            echo "::error::Production migration status still reports pending migrations."
            exit 1
          fi

          if [ "$status_code" -ne 0 ]; then
            echo "::error::Prisma migration status failed."
            exit "$status_code"
          fi

      - name: Verify branch head before deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$HEAD_BRANCH" \
            > latest-commit.json

          LATEST_SHA=$(node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('latest-commit.json','utf8')); console.log(body.sha ?? '')")
          if [ "$LATEST_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Refusing to deploy $EXPECTED_SHA because $HEAD_BRANCH is now $LATEST_SHA."
            exit 1
          fi

      - name: Deploy Vercel production artifact
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          APP_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --env APP_COMMIT_SHA="$APP_COMMIT_SHA" --token "$VERCEL_TOKEN"

      - name: Post-deploy health check
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          SITE_URL="$(echo "$NEXT_PUBLIC_SITE_URL" | tr -d '[:space:]')"
          URL="${SITE_URL}/api/health"
          echo "Polling $URL for commit $EXPECTED_COMMIT_SHA ..."

          for attempt in $(seq 1 10); do
            echo "Attempt $attempt/10 ..."
            STATUS="$(curl -sS -o health.json -w '%{http_code}' "$URL" || true)"
            if [ "$STATUS" = "200" ]; then
              DEPLOYED="$(node -p "JSON.parse(require('fs').readFileSync('health.json','utf8')).data?.commitSha ?? ''")"
              if [ "$DEPLOYED" = "$EXPECTED_COMMIT_SHA" ]; then
                echo "Health check passed: $DEPLOYED"
                exit 0
              fi
              echo "Commit mismatch: got $DEPLOYED, expected $EXPECTED_COMMIT_SHA"
            else
              echo "HTTP $STATUS"
            fi
            sleep 10
          done

          echo "::error::Health check failed after 10 attempts."
          exit 1
